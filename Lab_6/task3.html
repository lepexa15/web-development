<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна №6 - Завдання 3 (Лєпіхін Гліб ІТ-41/1)</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            max-width: 800px; 
            text-align: center; 
            margin-top: 10px;
        }
        th, td { border: 1px solid #333; padding: 10px; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h2>Завдання 3: Таблиця електронних компонентів</h2>
    <script>
	let products = [
    	   ["COMP-01", "Мікроконтролер ATmega328P", 150, 10],
    	   ["COMP-02", "Програматор USBasp", 120, 2],
    	   ["COMP-03", "Макетна плата", 80, 5],
    	   ["COMP-04", "Набір резисторів", 200, 1],
    	   ["COMP-05", "Конденсатор 100мкФ", 5, 50]
	];
        document.write("<table>");
        document.write("<tr><th>Код</th><th>Найменування</th><th>Ціна за од. (грн)</th><th>Кількість</th><th>Сума (грн)</th></tr>");
        let amount = 0; 
        for (let i = 0; i < products.length; i++) {
            let sum = products[i][2] * products[i][3];
            amount += sum;          
            document.write("<tr>" +
    		"<td>" + products[i][0] + "</td>" +
    		"<td>" + products[i][1] + "</td>" +
    		"<td>" + products[i][2] + "</td>" +
    		"<td>" + products[i][3] + "</td>" +
    		"<td>" + sum + "</td>" +
	"</tr>");
        }
        document.write("<tr>" +
  	     "<td colspan=\"4\" style=\"text-align: right; font-weight: bold;\">Всього:</td>" +
	     "<td style=\"font-weight: bold;\">" + amount + "</td>" +
	"</tr>");
        document.write("</table>");
    </script>
</body>
</html>
