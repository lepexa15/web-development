<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна №6 - Завдання 3 (Лєпіхін Гліб ІТ-41/1)</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { 
            border-collapse: collapse; 
            width: 100%; 
            max-width: 800px; 
            text-align: center; 
            margin-top: 10px;
        }
        th, td { border: 1px solid #333; padding: 10px; }
        th { background-color: #f0f0f0; }
    </style>
</head>
<body>
    <h2>Завдання 3: Таблиця електронних компонентів</h2>
    <script>
        let products = [
            [ code: "COMP-01", name: "Мікроконтролер ATmega328P", price: 150, quantity: 10 ],
            [ code: "COMP-02", name: "Програматор USBasp", price: 120, quantity: 2 ],
            [ code: "COMP-03", name: "Макетна плата", price: 80, quantity: 5 ],
            [ code: "COMP-04", name: "Набір резисторів", price: 200, quantity: 1 ],
            [ code: "COMP-05", name: "Конденсатор 100мкФ", price: 5, quantity: 50 ]
        ];
        document.write("<table>");
        document.write("<tr><th>Код</th><th>Найменування</th><th>Ціна за од. (грн)</th><th>Кількість</th><th>Сума (грн)</th></tr>");
        let amount = 0; 
        for (let i = 0; i < products.length; i++) {
            let sum = products[i].price * products[i].quantity;
            amount += sum;          
            document.write("<tr>" +
    		"<td>" + products[i].code + "</td>" +
    		"<td>" + products[i].name + "</td>" +
    		"<td>" + products[i].price + "</td>" +
    		"<td>" + products[i].quantity + "</td>" +
    		"<td>" + sum + "</td>" +
	"</tr>");
        }
        document.write("<tr>" +
  	     "<td colspan=\"4\" style=\"text-align: right; font-weight: bold;\">Всього:</td>" +
	     "<td style=\"font-weight: bold;\">" + amount + "</td>" +
	"</tr>");
        document.write("</table>");
    </script>
</body>
</html>
