<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна №6 - Завдання 2 (Лєпіхін Гліб ІТ-41/1)</title>
    <style>
        p.colored-block {
            padding: 15px;
            margin: 5px 0;
            border: 1px dashed #333;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <h2>Завдання 2: 5 абзаців з випадковим кольором</h2>
    <script>
        for (let i = 1; i <= 5; i++) {
            let r = Math.floor(Math.random() * 256);
            let g = Math.floor(Math.random() * 256);
            let b = Math.floor(Math.random() * 256);
            document.write("<p class=\"colored-block\" style=\"background-color: rgb(" + r + ", " + g + ", " + b + ");\">Абзац " + i + "</p>");
        }
    </script>
</body>
</html>
